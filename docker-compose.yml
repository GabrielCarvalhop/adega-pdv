# Alternativa ao Postgres embutido de dev (npm run db:dev) para quem tem Docker.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: adega
      POSTGRES_PASSWORD: adega
      POSTGRES_DB: adega
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
